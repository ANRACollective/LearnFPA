<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LearnFP&A — Dashboard</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="header">
    <div class="container header-inner">
      <div class="logo">
        <svg width="22" height="22" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg" style="flex-shrink:0">
          <rect width="32" height="32" rx="7" fill="var(--primary)"/>
          <line x1="4" y1="27" x2="28" y2="27" stroke="white" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
          <polyline points="4,22 9,16 14,19 20,9 27,5" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="27" cy="5" r="2.5" fill="white"/>
        </svg>
        <span><span style="color:var(--primary)">Learn</span>FP&amp;A</span>
      </div>
      <div class="header-right">
        <span id="user-email" style="display:none"></span>
        <button class="btn btn-ghost btn-sm" onclick="signOut()">Sign out</button>
      </div>
    </div>
  </header>

  <main class="container" style="padding-top:32px;padding-bottom:60px">

    <div style="display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:20px">
      <div>
        <h1 style="font-size:22px;font-weight:600">Your progress</h1>
        <p style="font-size:13px;color:var(--text-muted);margin-top:2px">12-week FP&amp;A curriculum · aligned with AFP FPAC &amp; Wharton</p>
      </div>
      <span id="resume-btn"></span>
    </div>

    <!-- Overall progress bar -->
    <div style="margin-bottom:24px">
      <div style="display:flex;justify-content:space-between;font-size:13px;color:var(--text-muted);margin-bottom:6px">
        <span id="progress-label">0 of 12 weeks completed</span>
        <span id="progress-pct">0%</span>
      </div>
      <div class="progress-bar-wrap" style="height:6px">
        <div class="progress-bar-fill" id="progress-fill" style="width:0%;height:6px"></div>
      </div>
    </div>

    <!-- Stats -->
    <div class="stats-row">
      <div class="stat-card">
        <div class="stat-num" id="stat-done">0</div>
        <div class="stat-label">Completed</div>
      </div>
      <div class="stat-card">
        <div class="stat-num" id="stat-remaining">12</div>
        <div class="stat-label">Remaining</div>
      </div>
      <div class="stat-card">
        <div class="stat-num">12</div>
        <div class="stat-label">Total weeks</div>
      </div>
    </div>

    <!-- Week grid -->
    <div id="week-grid" class="week-grid"></div>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="lessons-data.js"></script>
  <script>
    const LESSONS = window.LESSONS_DATA;

    // ── helpers ──────────────────────────────
    function dbCall(promise, ms = 6000) {
      return Promise.race([
        promise,
        new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), ms))
      ]);
    }

    // ── render dashboard with whatever progress map we have ──
    function renderDashboard(map) {
      const completedCount = Object.values(map).filter(p => p.completed_at).length;
      const pct = Math.round((completedCount / 12) * 100);

      document.getElementById('stat-done').textContent      = completedCount;
      document.getElementById('stat-remaining').textContent = 12 - completedCount;
      document.getElementById('progress-fill').style.width  = pct + '%';
      document.getElementById('progress-label').textContent = `${completedCount} of 12 weeks completed`;
      document.getElementById('progress-pct').textContent   = pct + '%';

      const visited    = Object.values(map).sort((a, b) => new Date(b.last_visited_at) - new Date(a.last_visited_at));
      const resumeWeek = visited.length ? visited[0].week_number : 1;
      const nextWeek   = Math.min(completedCount + 1, 12);

      if (completedCount < 12) {
        document.getElementById('resume-btn').innerHTML =
          `<a href="lesson.html?week=${resumeWeek}" class="btn btn-primary btn-sm">Resume → Week ${resumeWeek}</a>`;
      }

      const grid = document.getElementById('week-grid');
      grid.innerHTML = '';

      LESSONS.forEach(lesson => {
        const p      = map[lesson.week];
        const isDone = !!(p && p.completed_at);
        const isNext = lesson.week === nextWeek && !isDone;
        // All lessons available — no locking (personal learning tool)
        const isAvail = true;

        const cardClass = isDone ? 'done' : isNext ? 'active' : '';
        const badge = isDone
          ? '<span class="badge badge-done">✓ Done</span>'
          : isNext
          ? '<span class="badge badge-active">Up next</span>'
          : lesson.content
          ? '<span class="badge badge-active">Available</span>'
          : '<span class="badge badge-locked">Coming soon</span>';

        const quizTag = (p && p.quiz_score !== null && p.quiz_score !== undefined)
          ? `<div style="font-size:11px;color:var(--text-muted);margin-top:8px">Quiz: ${p.quiz_score}/3</div>`
          : '';

        const isClickable = !!lesson.content;
        const href    = isClickable ? `lesson.html?week=${lesson.week}` : '#';
        const onClick = isClickable ? '' : 'onclick="return false" style="opacity:.55;cursor:default"';

        grid.innerHTML += `
          <a href="${href}" class="week-card ${cardClass}" ${onClick}>
            <div class="week-card-header">
              <span class="week-num">Week ${lesson.week}</span>
              ${badge}
            </div>
            <div class="week-title">${lesson.title}</div>
            <div class="week-desc">${lesson.desc}</div>
            ${quizTag}
          </a>`;
      });
    }

    // ── init: show dashboard immediately, load progress in background ──
    async function init() {
      // Auth check — getSession() reads from local storage, nearly instant
      let session;
      try {
        const { data } = await dbCall(sb.auth.getSession(), 5000);
        session = data?.session;
      } catch (e) { session = null; }

      if (!session) { window.location.href = 'index.html'; return; }

      // Show email & render cards immediately with empty progress
      const el = document.getElementById('user-email');
      el.textContent = session.user.email;
      el.style.display = 'inline';
      renderDashboard({});

      // Load progress in background — update UI if it arrives
      try {
        const { data: progress } = await dbCall(
          sb.from('lesson_progress').select('*').eq('user_id', session.user.id)
        );
        if (progress && progress.length) {
          const map = {};
          progress.forEach(p => { map[p.week_number] = p; });
          renderDashboard(map);
        }
      } catch (e) { /* progress unavailable — dashboard already rendered */ }
    }

    async function signOut() {
      try { await dbCall(sb.auth.signOut(), 3000); } catch (e) {}
      window.location.href = 'index.html';
    }

    init();
  </script>
</body>
</html>
